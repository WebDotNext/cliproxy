name: cliproxy
services:
  cliproxy:
    image: ${CLIPROXY_IMAGE:-192.168.1.239:5000/cliproxy:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMMIT: ${CLIPROXY_COMMIT:-unknown}
    container_name: cliproxy
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8317:8317"
    networks:
      - default
      - app-network
    volumes:
      - ${CLIPROXY_DATA_DIR:-/home/wezz/.config/cliproxy}:/data
    environment:
      TZ: Pacific/Auckland
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Lets apps deployed on this host reach the proxy at http://cliproxy:8317 without exposing it beyond localhost.
networks:
  app-network:
    external: true
